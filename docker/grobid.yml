# GROBID をローカルで動かす。
#
# 上流の配布は用途で 2 系統に分かれている（https://grobid.readthedocs.io/en/latest/Grobid-docker/）:
#   grobid/grobid:<ver>-crf   CRF のみ。軽量・CPU で十分速い。PaperLens の既定はこちら
#   grobid/grobid:<ver>-full  Deep Learning 入り。精度は上がるが重く、GPU 推奨
# 文の分割と座標付けは CRF 版で実用になるので、まずはこのまま使ってよい。
services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    container_name: paperlens-grobid
    init: true
    ulimits:
      core: 0
    ports:
      # 127.0.0.1 に限定する。未公開原稿を投げる先を同一ネットワークに晒さない。
      - "127.0.0.1:8070:8070"
    environment:
      - JAVA_OPTS=-Xmx4g
    restart: unless-stopped
