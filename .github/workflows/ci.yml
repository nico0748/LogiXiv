name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GROBID は CI で立てない。E2E はフォールバック経路を通す。
      - run: npm run test:e2e
      # 解析品質の門番。ここを外すと、レイアウトの後退が黙って通る。
      - run: npm run measure
